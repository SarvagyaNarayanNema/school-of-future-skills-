<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="60%" stop-color="#071220" />
      <stop offset="100%" stop-color="#020710" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGlow)" />

  <!-- Perspective Floor Grid -->
  <g stroke="url(#gridGrad)" stroke-width="1.5" opacity="0.6">
    <line x1="640" y1="450" x2="0" y2="800" />
    <line x1="640" y1="450" x2="160" y2="800" />
    <line x1="640" y1="450" x2="320" y2="800" />
    <line x1="640" y1="450" x2="480" y2="800" />
    <line x1="640" y1="450" x2="640" y2="800" />
    <line x1="640" y1="450" x2="800" y2="800" />
    <line x1="640" y1="450" x2="960" y2="800" />
    <line x1="640" y1="450" x2="1120" y2="800" />
    <line x1="640" y1="450" x2="1280" y2="800" />
    
    <line x1="480" y1="520" x2="800" y2="520" />
    <line x1="380" y1="580" x2="900" y2="580" />
    <line x1="260" y1="650" x2="1020" y2="650" />
    <line x1="120" y1="730" x2="1160" y2="730" />
  </g>

  <!-- Glowing 3D Wireframe Polyhedron Centerpiece -->
  <g transform="translate(640, 360)" filter="url(#glow)">
    <!-- Outer hexagon -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.8" />
    <!-- Inner isometric lines -->
    <line x1="0" y1="-160" x2="0" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="138" y1="80" x2="0" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="-138" y1="80" x2="0" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    
    <polygon points="0,0 138,-80 0,-160" fill="#06b6d4" fill-opacity="0.12" />
    <polygon points="0,0 138,-80 138,80" fill="#3b82f6" fill-opacity="0.08" />
    <polygon points="0,0 -138,80 0,160" fill="#8b5cf6" fill-opacity="0.12" />
    
    <!-- Central Node -->
    <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="url(#glow)" />
    <!-- Vertices -->
    <circle cx="0" cy="-160" r="5" fill="#06b6d4" />
    <circle cx="138" cy="-80" r="5" fill="#38bdf8" />
    <circle cx="138" cy="80" r="5" fill="#818cf8" />
    <circle cx="0" cy="160" r="5" fill="#a78bfa" />
    <circle cx="-138" cy="80" r="5" fill="#818cf8" />
    <circle cx="-138" cy="-80" r="5" fill="#38bdf8" />
  </g>

  <!-- Top Institutional Branding -->
  <text x="640" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#38bdf8" text-anchor="middle" text-transform="uppercase">
    SCHOOL OF FUTURE SKILLS • WEBXR &amp; 3D RESEARCH
  </text>

  <!-- Project Title -->
  <text x="640" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="2" fill="#ffffff" text-anchor="middle">
    AEGIS 3D
  </text>
  <text x="640" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Spatial WebXR Engine &amp; Procedural Simulation Platform
  </text>

  <!-- Status Tag Pill -->
  <rect x="490" y="580" width="300" height="42" rx="21" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="516" cy="601" r="5" fill="#f59e0b" />
  <text x="532" y="607" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#fbbf24">
    URL VERIFICATION PENDING
  </text>
</svg>
